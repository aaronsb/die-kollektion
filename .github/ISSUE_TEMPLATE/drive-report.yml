name: Drive report
description: You drove a build of one of the vehicles; say what felt right and what didn't.
title: "Drive report: "
labels: ["drive-report"]
body:
  - type: markdown
    attributes:
      value: |
        One report per vehicle and build. `make status` shows the build you have installed.
  - type: dropdown
    id: vehicle
    attributes:
      label: Vehicle
      options:
        - Das Glyptodon
        - Das Megaloceros
        - Das Mastodon
        - Das Megatherium
        - Das Mammoth (stock car, patched)
        - Another stock car (patch)
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build you drove
      description: The commit or pull request you had installed (`make status` shows it).
      placeholder: "main @ dca1009, or PR #3 @ 1a2b3c4"
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: Where you drove, which upgrades were fitted, the weather, anything that sets the scene.
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What felt right
  - type: textarea
    id: wrong
    attributes:
      label: What felt wrong or looked off
      description: Handling, suspension, how a part sits, clipping, floating upgrades, lights, sounds.
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots
      description: Optional. Drag images in here.
