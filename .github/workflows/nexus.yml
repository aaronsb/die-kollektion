# Uploads each published release's Werkstatt zip to Nexus Mods (https://www.nexusmods.com/overthehill/mods/51) as a
# new version of the main file, with that version's changelog. A separate workflow, so a Nexus failure leaves the
# GitHub release as it is; re-run one release with workflow_dispatch and its tag. Uses Nexus Mods' official
# upload action (Upload API v3, beta) and the repository secret NEXUSMODS_API_KEY.
name: nexus

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (e.g. v0.6.0)
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Nexus ids, from the v3 API (/games/overthehill/mods/51 and /mods/<id>/files): the mod, and the main file
  # whose update chain each release extends.
  NEXUS_MOD_ID: "45642617454643"
  NEXUS_FILE_ID: "8192610"

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        id: version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Not a release tag: $TAG"; exit 1 ;; esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Wait for the release workflow's checks on this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            run=$(gh run list --workflow release.yml --branch "$TAG" --event push --limit 1 --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "release.yml passed for $TAG"; exit 0 ;;
              completed*) echo "release.yml didn't pass for $TAG ($run); not uploading"; exit 1 ;;
            esac
            sleep 20
          done
          echo "release.yml for $TAG didn't finish within 20 minutes (${run:-no run found}); not uploading"
          exit 1
      - name: The Werkstatt zip, checked against SHA256SUMS, and the changelog
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release.py nexus-files "${{ steps.version.outputs.version }}" nexus
          {
            echo "changelog<<NEXUS_CHANGELOG_EOF"
            cat nexus/changelog.txt
            echo "NEXUS_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Skip a version Nexus already has
        id: existing
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf 'apikey: %s\n' "$NEXUS_API_KEY" | curl -fsS -H @- -H "User-Agent: die-kollektion-ci" \
            "https://api.nexusmods.com/v3/mod-files/$NEXUS_FILE_ID/versions" -o versions.json
          if python3 -c 'import json, os, sys; v = json.load(open("versions.json"))["data"]["versions"]; sys.exit(0 if any(x["version"] == os.environ["VERSION"] for x in v) else 1)'; then
            echo "Nexus already has $VERSION; nothing to upload"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Nexus Mods
        if: steps.existing.outputs.skip != 'true'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUS_FILE_ID }}
          filename: nexus/die-kollektion-werkstatt-${{ steps.version.outputs.version }}.zip
          version: ${{ steps.version.outputs.version }}
          display_name: Die Kollektion Werkstatt ${{ steps.version.outputs.version }}
          description: "Werkstatt with the plugin ready-made, plus the Die Kollektion trucks' sources. Unzip, open a terminal in the folder, run `make start`. Checksums: SHA256SUMS on the GitHub release."
          category: main
          archive_existing_version: true
          allow_mod_manager_download: false
          update_mod_version: true
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ steps.files.outputs.changelog }}
