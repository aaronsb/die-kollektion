# Uploads each released version's Werkstatt zip to Nexus Mods (https://www.nexusmods.com/overthehill/mods/51) as a
# new version of the main file, with that version's changelog. A separate workflow, so a Nexus failure leaves the
# GitHub release as it is; re-run one release with workflow_dispatch and its tag. Uses Nexus Mods' official
# upload action (Upload API v3, beta) and the repository secret NEXUSMODS_API_KEY.
#
# The tools run from this workflow's own ref; the tag supplies only data (its changelogs, via git show) and the
# release supplies the zip, so a re-run for an older tag works with today's tools.
name: nexus

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (e.g. v0.6.0)
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_REPO: ${{ github.repository }}
  # Nexus ids, from the v3 API (/games/overthehill/mods/51 and /mods/<id>/files): the mod, and the main file
  # whose update chain each release extends.
  NEXUS_MOD_ID: "45642617454643"
  NEXUS_FILE_ID: "8192610"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Release tag
        id: version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag (vX.Y.Z): $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for the release workflow's checks on this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            run=$(gh run list --workflow release.yml --branch "$TAG" --event push --limit 1 \
              --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"') || run=""
            case "$run" in
              "completed success") echo "release.yml passed for $TAG"; exit 0 ;;
              completed*) echo "::error::release.yml didn't pass for $TAG ($run); not uploading"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::release.yml for $TAG didn't finish within 20 minutes (${run:-no run found}); not uploading"
          exit 1
      - name: The Werkstatt zip, checked against SHA256SUMS, and the tag's changelog
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p nexus
          git show "$TAG:docs/nexus/changelog.txt" > nexus/tag-nexus-changelog.txt 2>/dev/null || rm -f nexus/tag-nexus-changelog.txt
          git show "$TAG:CHANGELOG.md" > nexus/tag-CHANGELOG.md
          python3 tools/release.py nexus-files "$VERSION" nexus nexus/tag-nexus-changelog.txt nexus/tag-CHANGELOG.md
          delimiter="CHANGELOG_$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          {
            echo "changelog<<$delimiter"
            cat nexus/changelog.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Nexus preflight (the mod, and the versions the file already has)
        id: preflight
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          api() { printf 'apikey: %s\n' "$NEXUS_API_KEY" | curl -fsS -H @- -H "User-Agent: die-kollektion-ci" "https://api.nexusmods.com/v3$1"; }
          api "/mods/$NEXUS_MOD_ID" > mod.json
          echo "Nexus mod: $(python3 -c 'import json; m = json.load(open("mod.json"))["data"]; print(m["name"], "(game-scoped id", m["game_scoped_id"] + ")")')"
          api "/mod-files/$NEXUS_FILE_ID/versions" > versions.json
          plan=$(python3 tools/release.py nexus-preflight "$VERSION" versions.json)
          if [ "$plan" = skip ]; then
            echo "::warning::Nexus already has $VERSION; nothing uploaded, and its changelog isn't posted again"
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - name: Upload to Nexus Mods
        if: steps.preflight.outputs.plan == 'upload'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUS_FILE_ID }}
          filename: nexus/die-kollektion-werkstatt-${{ steps.version.outputs.version }}.zip
          version: ${{ steps.version.outputs.version }}
          display_name: Die Kollektion Werkstatt ${{ steps.version.outputs.version }}
          description: "Werkstatt with the plugin ready-made, plus the Die Kollektion trucks' sources. Unzip, open a terminal in the folder, run `make start`. Checksums: SHA256SUMS on the GitHub release."
          category: main
          archive_existing_version: true
          allow_mod_manager_download: false
          update_mod_version: true
          mod_id: ${{ env.NEXUS_MOD_ID }}
          changelog: ${{ steps.files.outputs.changelog }}
