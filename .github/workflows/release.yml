# Runs when `make release` pushes a v* tag: the same checks, the tag against the versions in the repo, and the
# GitHub release's assets against its SHA256SUMS. It builds nothing; the plugin is compiled by `make release`
# on a machine with the game.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Checks
        run: python3 tools/release.py ci
      - name: The tag matches the plugin, the pack and CHANGELOG.md
        run: python3 tools/release.py check-versions "${GITHUB_REF_NAME#v}"
      - name: The release has its zips and SHA256SUMS, and they match
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py check-assets "${GITHUB_REF_NAME#v}"
