# Every check that needs no game files: CI can't build vehicles (they're made from the player's own install),
# so meshes, gates on built meshes and the plugin compile run on a machine with the game (`make check`, `make release`).
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Checks (tools compile, versions, unit tests, real names, catalogue, pack manifests, hook-page placement)
        run: python3 tools/release.py ci

  # `kollektion` is one source with two targets. Each is built and tested on its own OS (the same tests run the
  # Windows build under Wine locally), and the build that passed is kept as an artifact.
  kollektion:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build kollektion for ${{ matrix.rid }}
        run: dotnet publish src/kollektion -c Release -r ${{ matrix.rid }} -nologo -o build/kollektion/${{ matrix.rid }}
      - name: Test it on ${{ matrix.os }}
        env:
          KOLLEKTION_TESTS: "1"
        run: python -m unittest discover -s tests -p test_kollektion.py -v
      # The truck build and the game-data reader on Windows' own C runtime, whose maths can differ from glibc's in
      # the last bit (the checks job runs both on Linux).
      - name: Vehicle build and game-data reader on Windows
        if: runner.os == 'Windows'
        run: |
          dotnet run --project tools/meshops-check -v quiet -- tests/meshops
          dotnet run --project tools/gamedata-check -f net10.0 -v quiet
          dotnet run --project tools/gamedata-check -f net6.0 -p:RollForward=Major -v quiet
      # upload-artifact drops the execute bit; the release that packs this artifact sets it again.
      - uses: actions/upload-artifact@v4
        with:
          name: kollektion-${{ matrix.rid }}
          path: build/kollektion/${{ matrix.rid }}/
          if-no-files-found: error
